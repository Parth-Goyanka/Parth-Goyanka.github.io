title: Parthsarthi Goyanka
description: Control, optimization, and geometric methods for multi-time-scale systems
url: "https://parth-goyanka.github.io"
baseurl: ""

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate

# Pagination
paginate: 6
paginate_path: "/blog/page:num/"

# Author information
author:
  name: Parthsarthi
  email: nnparthsarthi_b23@el.vjti.ac.in
  github: Parth-Goyanka
  # TODO(Parth): provide full LinkedIn and Google Scholar URLs, then uncomment.
  # The links in index.md only render when these are set.
  # linkedin: https://www.linkedin.com/in/...
  # scholar: https://scholar.google.com/citations?user=...

# Collections
collections:
  papers:
    output: true
    permalink: /papers/:path/

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
